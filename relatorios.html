<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Relatórios | SIEF</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header class="app-header">
			<a class="brand" href="cliente.html">
				<span class="brand-mark">S</span>
				<span>
					<strong>SIEF</strong>
					<small>Portal do cliente</small>
				</span>
			</a>
			<div>
				<span id="userName"></span>
				<button class="text-button" data-logout>Sair</button>
			</div>
		</header>

		<div class="app-layout">
			<aside>
				<a href="cliente.html">Minha área</a>
				<a class="active" href="relatorios.html">Relatórios</a>
			</aside>

			<main class="app-main">
				<p class="eyebrow">RELATÓRIOS</p>
				<h1>Resumo dos seus pedidos</h1>

				<section class="stats" id="reportStats"></section>

				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th>Pedido</th>
								<th>Carga</th>
								<th>Rota</th>
								<th>Valor</th>
								<th>Status</th>
								<th>Data</th>
							</tr>
						</thead>
						<tbody id="reportTable"></tbody>
					</table>
				</div>
			</main>
		</div>

		<script src="app.js"></script>
	</body>
</html>
