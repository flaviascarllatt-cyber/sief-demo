<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Minha area | SIEF</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="app-header">
            <a class="brand" href="index.html">
                <span class="brand-mark">S</span>
                <span>
                    <strong>SIEF</strong>
                    <small>Portal do cliente</small>
                </span>
            </a>
            <div>
                <span id="userName"></span>
                <button class="text-button" data-logout>Sair</button>
            </div>
        </header>
        <div class="app-layout">
            <aside>
                <a class="active" href="cliente.html">Minha area</a>
                <a href="relatorios.html">Relatorios</a>
                <a href="perfil.html">Perfil</a>
                <button id="librasBtn" class="side-button">VLibras</button>
                <button id="tutorialBtn" class="side-button">Tutorial guiado</button>
            </aside>
            <main class="app-main">
                <button id="menuToggle" class="menu-toggle" aria-label="Mostrar ou esconder menu">☰ Menu</button>
                <div class="page-title">
                    <div>
                        <p class="eyebrow">PAINEL DO CLIENTE</p>
                        <h1>Ola, <span id="clientName"></span>!</h1>
                        <p>Cadastre um frete ou acompanhe suas entregas.</p>
                    </div>
                    <button class="button" id="openOrder">+ Novo pedido</button>
                </div>
                <section class="stats" id="clientStats"></section>
                <section>
                    <h2>Rastreamento de pedidos</h2>
                    <p class="muted">O status e atualizado pela equipe SIEF.</p>
                    <div id="trackingList" class="tracking-list"></div>
                </section>
            </main>
        </div>
        <dialog id="orderModal">
            <form id="orderForm">
                <div class="modal-top">
                    <h2 id="orderModalTitle">Novo pedido</h2>
                    <button type="button" class="close" data-close>&times;</button>
                </div>

                <input id="orderId" type="hidden">

                <div class="form-grid">
                    <div class="form-row">
                        <label for="foodType">Tipo de alimento</label>
                        <select id="foodType" required>
                            <option value="">Selecione</option>
                            <option value="Nao Perecivel">Não Perecivel</option>
                            <option value="Perecivel">Perecivel</option>
                            <option value="Congelado">Congelado / Frio</option>
                            <option value="Graos">Grãos</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="quantity">Quantidade (kg)</label>
                        <input id="quantity" type="number" min="1" required>
                    </div>

                    <div class="form-row">
                        <label for="origin">Cidade de partida</label>
                        <input id="origin" required>
                    </div>

                    <div class="form-row">
                        <label for="destination">Destino final</label>
                        <input id="destination" required>
                    </div>

                    <div class="form-row">
                        <label for="distance">Distância (km)</label>
                        <input id="distance" type="number" min="0" required>
                    </div>

                    <div class="form-row">
                        <label>Frete estimado</label>
                        <div id="freightValue">R$ 0,00</div>
                    </div>

                    <div class="form-actions">
                        <button class="button" type="submit">Salvar pedido</button>
                        <button class="button light" type="button" data-close>Cancelar</button>
                    </div>
                </div>
            </form>
        </dialog>
