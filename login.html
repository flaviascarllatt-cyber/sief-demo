<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Entrar | SIEF</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body class="auth-page">
		<a class="skip" href="#conteudo">Pular para o conteúdo</a>

		<main id="conteudo" class="auth-box">
			<a class="brand centered" href="index.html">
				<span class="brand-mark">S</span>
				<span>
					<strong>SIEF</strong>
					<small>Entregas e Fretes</small>
				</span>
			</a>

			<h1>Que bom ter você de volta</h1>
			<p>Entre para acompanhar seus pedidos.</p>

			<form id="loginForm">
				<label for="email">E-mail</label>
				<input id="email" type="email" required autocomplete="email">

				<label for="senha">Senha</label>
				<input id="senha" type="password" required minlength="6" autocomplete="current-password">

				<p id="loginFeedback" class="feedback" aria-live="polite"></p>
				<button class="button full" type="submit">Entrar</button>
			</form>

			<p class="center">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>

			<div class="demo">
				<strong>Conta administradora para teste</strong>
				<br>
				admin@sief.com • senha: <code>Sief@2026</code>
			</div>

			<a class="back" href="index.html">← Voltar ao início</a>
		</main>

		<script src="app.js"></script>
	</body>
</html>
